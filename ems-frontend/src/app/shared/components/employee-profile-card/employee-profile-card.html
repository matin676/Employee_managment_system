<article class="employee-card" tabindex="0" aria-label="Employee profile card">
  <!-- Header: Avatar, Name, and Role -->
  <header class="employee-card__header">
    <div class="employee-card__avatar-container">
      <span class="employee-card__avatar-initials">{{ getInitials() }}</span>
    </div>
    <div class="employee-card__info">
      <h3 class="employee-card__name">{{ employee.firstName }} {{ employee.lastName }}</h3>
      <p class="employee-card__role">
        {{ employee.jobTitle || employee.qualification || 'Staff' }}
      </p>
    </div>
  </header>

  <hr class="employee-card__divider" aria-hidden="true" />

  <!-- Body: Contact Details -->
  <div class="employee-card__details">
    <div class="employee-card__detail-item">
      <!-- Assuming use of Material Symbols font -->
      <span class="material-symbols-outlined" aria-hidden="true">mail</span>
      <span>{{ employee.email }}</span>
    </div>
    <div class="employee-card__detail-item">
      <span class="material-symbols-outlined" aria-hidden="true">domain</span>
      <span>{{ employee.department }}</span>
    </div>
  </div>

  <!-- Footer: Status and Actions -->
  <footer class="employee-card__footer">
    <span
      class="employee-card__status"
      [ngClass]="'employee-card__status--' + (employee.status | lowercase)"
    >
      {{ employee.status }}
    </span>

    <button class="employee-card__action-button" aria-label="More options">
      <span class="material-symbols-outlined">more_vert</span>
    </button>
  </footer>
</article>
