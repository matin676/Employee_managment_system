<app-card title="Create New Broadcast" class="admin-announcement-card">
  <form (ngSubmit)="submit()" #announcementForm="ngForm" class="md3-form">
    <div class="form-group">
      <label class="md3-label">Title</label>
      <input
        type="text"
        [(ngModel)]="request().title"
        name="title"
        required
        class="md3-input"
        placeholder="e.g., Holiday Notice"
      />
    </div>

    <div class="form-group">
      <label class="md3-label">Content</label>
      <textarea
        [(ngModel)]="request().content"
        name="content"
        required
        rows="4"
        class="md3-input md3-textarea"
        placeholder="Announcement details..."
      ></textarea>
    </div>

    <div class="form-row">
      <div class="form-group half-width">
        <label class="md3-label">Priority</label>
        <div class="md3-select-wrapper">
          <select [(ngModel)]="request().priority" name="priority" class="md3-select">
            <option value="NORMAL">Normal</option>
            <option value="IMPORTANT">Important</option>
            <option value="URGENT">Urgent</option>
          </select>
          <span class="material-symbols-outlined dropdown-icon">expand_more</span>
        </div>
      </div>
      <div class="form-group half-width">
        <label class="md3-label">Expires At (Optional)</label>
        <input
          type="datetime-local"
          [(ngModel)]="request().expiresAt"
          name="expiresAt"
          class="md3-input"
        />
      </div>
    </div>

    <div class="form-actions">
      <button
        type="submit"
        [disabled]="loading() || !announcementForm.form.valid"
        class="md3-btn filled-btn publish-btn"
      >
        @if (loading()) {
          <span class="material-symbols-outlined spin-icon">sync</span>
        }
        <span>{{ loading() ? 'Publishing...' : 'Publish Announcement' }}</span>
      </button>
    </div>
  </form>
</app-card>
